<!DOCTYPE HTML>
<html>

<head>
    <title> Project Preview </title>
    <script src="https://ui5.sap.com/1.136.9/resources/sap-ui-core.js" 
            id="sap-ui-bootstrap"
            data-sap-ui-theme="sap_horizon"
            data-sap-ui-bindingSyntax="complex" 
            data-sap-ui-xx-bindingSyntax="complex">
    </script>
    <link rel="stylesheet" href="assets/preview.css">
</head>

<body id="body" class="sapUiBody">
    <script>
        "use strict";
        sap.ui.localResources("assets");
        (function (jQuery, App, Page) {
            sap.ui.getCore().attachInit(function () {
                sap.ui.define([
                    "sap/ui/core/mvc/Controller",
                    "sap/ui/model/json/JSONModel"
                ], function (Controller, JSONModel) {
                    return Controller.extend("PreviewController", {
                        onInit: function () {

                            const data = {"Services":[{"ServiceName":"asset_MasterSrv","DetailsURL":"./odata/v4/asset_accounting/","Metadata":"./odata/v4/asset_accounting/$metadata","Entities":[{"Name":"AssetMaster","URL":"./odata/v4/asset_accounting/AssetMaster","FioriURL":"$fiori-preview/asset_MasterSrv/AssetMaster#preview-app"},{"Name":"PurchaseRequisition","URL":"./odata/v4/asset_accounting/PurchaseRequisition","FioriURL":"$fiori-preview/asset_MasterSrv/PurchaseRequisition#preview-app"},{"Name":"PurchaseOrder","URL":"./odata/v4/asset_accounting/PurchaseOrder","FioriURL":"$fiori-preview/asset_MasterSrv/PurchaseOrder#preview-app"},{"Name":"GoodsReceipt","URL":"./odata/v4/asset_accounting/GoodsReceipt","FioriURL":"$fiori-preview/asset_MasterSrv/GoodsReceipt#preview-app"},{"Name":"Invoice","URL":"./odata/v4/asset_accounting/Invoice","FioriURL":"$fiori-preview/asset_MasterSrv/Invoice#preview-app"}],"EntitiesCount":5}]}
                            this.getView().setModel(new JSONModel(data));
                        }
                    });
                });
                var oApp = new App()
                var previewView = sap.ui.view({
                    viewName: "assets.Preview",
                    type: sap.ui.core.mvc.ViewType.XML
                });
                oApp.addPage(new Page({
                    content: [previewView],
                    showHeader: false
                })).placeAt("content");
            });

        }(jQuery, sap.m.App, sap.m.Page));
    </script>
    <div id="content"></div>
</body>

</html>
