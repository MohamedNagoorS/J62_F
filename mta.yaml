_schema-version: 3.3.0
ID: Asset_Master
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm run build
modules:
  - name: Asset_Master-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Asset_Master-db
      - name: Asset_Master-xsuaa
      - name: Asset_Master-destination

  - name: Asset_Master-approuter
    type: approuter.nodejs
    path: app
    requires:
      - name: Asset_Master-xsuaa
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}

  - name: Asset_Master-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Asset_Master-db

resources:
  - name: Asset_Master-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: Asset_Master-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Asset_Master-${org}-${space}
        tenant-mode: dedicated

  - name: Asset_Master-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
